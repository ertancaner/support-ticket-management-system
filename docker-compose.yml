services:
  postgres:
    image: postgres:16-alpine
    container_name: ticket_system_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ticket_management_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-SuperSecretPostgresPassword123!}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ticket_management_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ticket_system_backend
    restart: on-failure
    ports:
      - "${PORT_BACKEND:-5001}:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Host=postgres;Port=5432;Database=${POSTGRES_DB:-ticket_management_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-SuperSecretPostgresPassword123!}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_TEMP_PASSWORD=${ADMIN_TEMP_PASSWORD:-AdminTempPassword123!}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-SuperSecretKeyForTicketManagementSystemMustBeAtLeast32CharactersLong123!}
      - JWT_ISSUER=${JWT_ISSUER:-TicketManagementApi}
      - JWT_AUDIENCE=${JWT_AUDIENCE:-TicketManagementClient}
      - JWT_ACCESS_TOKEN_EXPIRATION_MINUTES=${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:-15}
      - JWT_REFRESH_TOKEN_EXPIRATION_DAYS=${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:-7}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ticket_system_frontend
    restart: on-failure
    ports:
      - "${PORT_FRONTEND:-3000}:80"
    depends_on:
      - backend
    networks:
      - app-network

volumes:
  postgres_data:
    driver: local

networks:
  app-network:
    driver: bridge
